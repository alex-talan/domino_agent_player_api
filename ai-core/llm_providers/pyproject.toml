[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-core-llm_providers"
version = "0.1.0"
description = "LLM provider adapters module for ai-core"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-aws>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-ollama>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
sources = {"." = "llm_providers"}
include = ["*.py", "domain/**", "infrastructure/**"]

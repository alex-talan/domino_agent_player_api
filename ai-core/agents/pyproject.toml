[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-core-agents"
version = "0.1.0"
description = "Composable LangChain agents with typed output and tools"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "pydantic>=2.0",
    "ai-core-tools>=0.1.0",
    "ai-core-llm_providers>=0.1.0",
    "ai-core-prompt_providers>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
sources = {"." = "agents"}
include = ["*.py", "domain/**", "infrastructure/**"]
